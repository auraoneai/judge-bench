[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-bench"
version = "0.1.2"
description = "Synthetic bias and calibration probes for testing LLM-as-judge reliability."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AuraOne" }]
keywords = ["llm-as-judge", "judge-bias", "model-evaluation", "calibration", "evals", "synthetic-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/auraoneai/judge-bench"
Documentation = "https://github.com/auraoneai/judge-bench#readme"
Repository = "https://github.com/auraoneai/judge-bench.git"
Issues = "https://github.com/auraoneai/judge-bench/issues"
Changelog = "https://github.com/auraoneai/judge-bench/blob/main/CHANGELOG.md"

[project.scripts]
judge-bench = "judge_bench.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
